<title>Vila {{NOME_DA_AGENCIA}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap">
<style>
/* Layout: the living pixel town on the left (camera follows you), the team / chat / meeting panel on the right. One committed night-blue look. */
:root{
  --ink:#0a0f24; --panel:#111838; --panel-2:#18214a; --line:#2a3670;
  --fg:#eef1ff; --muted:#8ea3ea; --blue:#0131cb; --lime:#b9fc01; --warn:#ff8a5c; --rec:#ff4d6d;
  --display:"Pixelify Sans","Silkscreen",ui-monospace,monospace;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tag:"Silkscreen",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--body);margin:0;overflow:hidden}
*{box-sizing:border-box}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

.shell{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.mark{width:28px;height:28px;background:var(--lime);color:var(--blue);display:grid;place-items:center;font:700 15px/1 var(--display);box-shadow:3px 3px 0 var(--blue)}
.bar h1{margin:0;font:700 20px/1 var(--display);letter-spacing:.02em}
.clock{font:12px/1 var(--tag);color:var(--fg);padding:6px 8px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbtn{font:11px/1 var(--tag);background:none;border:1px solid var(--line);color:var(--muted);padding:6px 8px}
.tbtn[aria-pressed="true"]{background:var(--lime);color:var(--blue);border-color:var(--lime)}
.hint{margin-left:auto;font-size:12.5px;color:var(--muted);min-width:0}
.hint b{color:var(--fg);font-weight:600}

.app{flex:1;min-height:0;display:flex}
.app[hidden],.page[hidden]{display:none!important}
.vcol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.vcol .stage{flex:1;min-height:0}
.people{flex:none;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
.pcard{flex:none;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;padding:6px 10px 6px 6px;background:var(--panel-2);border:1px solid var(--line);text-align:left;min-width:150px;max-width:190px}
.pcard:hover{border-color:var(--lime)}
.pcard .portrait{width:30px;height:38px}
.pcard b{display:block;font-size:13px}.pcard small{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:100%}
.tab{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);color:var(--muted);padding:7px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.tab .ic{font-size:15px}
.tab[aria-selected="true"]{background:var(--lime);color:var(--blue);border-color:var(--lime)}
.tab .bdg{font:10px/1 var(--tag);background:var(--warn);color:#111;padding:3px 5px;border-radius:9px}
.page{flex:1;min-height:0;overflow:auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.pwrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.phead h2{margin:4px 0 0;font:700 26px/1.1 var(--display)}.phead p{margin:6px 0 0;color:var(--muted);font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.who{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--panel);border:1px solid var(--line)}
.who.hot{border-color:var(--warn)}
.whohead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.whohead .portrait{width:40px;height:50px}
.chip{font:10px/1 var(--tag);padding:4px 6px;border:1px solid var(--muted);color:var(--muted);white-space:nowrap}
.chip.nova{border-color:#5ce0ff;color:#5ce0ff}.chip.andamento{border-color:#ffb35c;color:#ffb35c}.chip.feito{border-color:var(--lime);color:var(--lime)}.chip.pergunta,.chip.erro{border-color:var(--warn);color:var(--warn)}
.otile{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;line-height:1.4}
.otile p{margin:0}.otile .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.otile textarea{min-height:56px;background:var(--ink);border:1px solid var(--line);padding:8px;font-size:13.5px}
.bigcard{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.bigcard:hover{border-color:var(--lime)}
.bigcard .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bigcard .thumbs img{width:100%;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--line);background:var(--ink)}
.bigcard b{font:700 16px/1.2 var(--display)}
.ftile{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--panel);border:1px solid var(--line);text-align:left}
.ftile:hover{border-color:var(--lime)}
.ftile .cov{position:relative;aspect-ratio:4/3;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.ftile .cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.ftile b{font:700 16px/1.1 var(--display)}.ftile span{font-size:12px;color:var(--muted)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--warn);font-size:14px}
.todo button{margin-left:auto;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.legend span{padding:6px 9px;border:1px solid var(--line);background:var(--panel-2)}
.rnota.n9,.rnota.n10{background:var(--lime);color:var(--blue)}
.memgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.page .panelish{max-width:760px}
.stage{flex:1;min-width:0;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#16245e 0%,var(--ink) 70%)}
.world{position:absolute;left:0;top:0;will-change:transform}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.ov{position:absolute;inset:0;pointer-events:none}
.tag,.bubble,.sign{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.tag{font:9px/1 var(--tag);padding:2px 4px 3px;background:rgba(10,15,36,.82);color:var(--fg);border:1px solid rgba(142,163,234,.35)}
.tag.you{background:var(--lime);color:var(--blue);border-color:var(--lime)}
.tag.sel{background:var(--blue);border-color:var(--lime)}
.bubble{max-width:210px;white-space:normal;font:600 11.5px/1.3 var(--body);background:#fff;color:#0a0f24;padding:6px 8px;border:2px solid #0a0f24;box-shadow:2px 2px 0 rgba(0,0,0,.35);opacity:0;transition:opacity .25s}
.bubble.on{opacity:1}
.bubble.talk{border-color:var(--blue);box-shadow:2px 2px 0 var(--lime)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:8px;height:8px;background:#fff;border-right:2px solid #0a0f24;border-bottom:2px solid #0a0f24;transform:translateX(-50%) rotate(45deg)}
.sign{font:9px/1 var(--tag);color:var(--blue);background:var(--lime);padding:3px 5px;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.sign.w{background:#fff}
.stage{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.dragging{cursor:grabbing}
.camctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;z-index:2;display:flex;gap:8px}
.zoom{font:11px/1 var(--tag);background:var(--lime);color:var(--blue);border:0;padding:9px 11px;box-shadow:3px 3px 0 var(--blue)}
.zoom.alt{background:#fff}
.camhint{position:absolute;left:12px;bottom:12px;margin:0;z-index:2;font:10px/1.3 var(--tag);color:var(--muted);background:rgba(10,15,36,.7);padding:6px 8px;pointer-events:none;max-width:60%}

.panel{width:390px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pscroll{flex:1;min-height:0;overflow:auto;padding:18px;padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.eyebrow{font:11px/1 var(--tag);color:var(--muted);letter-spacing:.06em}
.ptitle{margin:6px 0 0;font:700 22px/1.1 var(--display)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.primary{background:var(--lime);color:var(--blue);border:0;font:800 13px/1 var(--body);padding:11px 14px;box-shadow:3px 3px 0 var(--blue)}
.ghost{background:none;border:1px solid var(--line);font-size:12.5px;padding:9px 11px}
.ghost:hover{border-color:var(--muted)}
.ghost[aria-pressed="true"]{border-color:var(--lime);color:var(--lime)}
.roster{display:flex;flex-direction:column;gap:8px}
.person{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px;background:var(--panel-2);border:1px solid var(--line);text-align:left;width:100%}
.person:hover{border-color:var(--muted)}
.portrait{width:44px;height:56px;image-rendering:pixelated;background:linear-gradient(#22306b,#18214a);border:1px solid var(--line)}
.pname{font-weight:800;font-size:14px}
.prole{font-size:12px;color:var(--muted)}
.pact{font-size:12.5px;line-height:1.35;margin-top:4px;min-width:0;display:flex;gap:6px;align-items:baseline}
.dot{width:7px;height:7px;flex:none;background:var(--muted);transform:translateY(-1px)}
.dot.work{background:var(--lime)} .dot.home{background:#ffb35c} .dot.sleep{background:#5c6fb0} .dot.out{background:#5ce0ff}
.go{font:11px/1 var(--tag);background:var(--lime);color:var(--blue);padding:7px 8px}
.convs{display:flex;flex-direction:column;gap:8px}
.conv{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;border:1px dashed var(--muted);font-size:13px}
.conv b{font-weight:800}
.agenda{display:flex;flex-direction:column;font-size:13px}
.ag{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ag time{font:11px/1.4 var(--tag);color:var(--lime)}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;margin-left:6px;border:1px solid var(--muted);color:var(--muted)}

.chat{display:flex;flex-direction:column;min-height:0;flex:1}
.chead{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.back{background:none;border:1px solid var(--line);padding:6px 9px;font:11px/1 var(--tag)}
.cstat{font-size:12px;color:var(--muted);line-height:1.35;margin-top:3px}
.msgs{flex:1;min-height:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:9px 11px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.m.them{background:var(--panel-2);border:1px solid var(--line);align-self:flex-start}
.m.me{background:var(--blue);align-self:flex-end}
.m.sys{align-self:center;max-width:100%;font-size:12.5px;color:var(--muted);background:none;text-align:center;padding:4px}
.m .who{display:block;font:10px/1 var(--tag);color:var(--muted);margin-bottom:5px}
.m.me .who{color:#c9d4ff}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.chip{background:none;border:1px dashed var(--muted);font-size:12.5px;padding:6px 9px;text-align:left}
.chip:hover{border-style:solid}
.compose{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.compose textarea{flex:1;min-width:0;resize:none;height:44px;background:var(--panel-2);border:1px solid var(--line);padding:10px;font-size:14px}
.mic{flex:none;width:44px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center}
.mic svg{width:18px;height:18px;fill:currentColor}
.mic.rec{background:var(--rec);border-color:var(--rec);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(255,77,109,.25)}}
.send{background:var(--lime);color:var(--blue);border:0;font:700 13px/1 var(--body);padding:0 14px}
.send[disabled]{opacity:.45;cursor:default}
.stop{background:none;border:1px solid var(--warn);color:var(--warn);font:700 13px/1 var(--body);padding:0 12px}
.cfoot{display:flex;flex-direction:column;gap:8px;padding:0 18px 14px;font-size:11.5px;color:var(--muted);line-height:1.4;padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.row{display:flex;gap:8px;flex-wrap:wrap}
.mural{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--panel-2);border:1px solid var(--line);font-size:13.5px;line-height:1.45}
.mural.hot{border-color:var(--lime);box-shadow:0 0 0 2px rgba(185,252,1,.25)}
.mural p{margin:0}
.mural ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.mural .primary{align-self:flex-start}
.mwhen{font:11px/1.3 var(--tag);color:var(--lime)}
.mlab{font:10px/1 var(--tag);color:var(--muted);margin-top:4px}
.mnote{color:var(--muted);font-size:12.5px}
.ordens,.alter,.memsec{display:flex;flex-direction:column;gap:8px}
.memrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;font-size:12.5px;line-height:1.4;padding:6px 8px;background:var(--panel-2);border:1px solid var(--line)}
.memrow .ghost{flex:none;padding:3px 6px;font-size:11px}
.netst{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px;border:1px solid var(--line);font-size:12.5px}
.netst .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.netst.on .dot{background:var(--lime)}.netst.off{border-color:var(--warn)}.netst.off .dot{background:var(--warn)}
.netst .prole{flex-basis:100%}.netst .ghost{padding:5px 8px;font-size:11.5px}
.matbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px;background:var(--panel-2);border:1px solid var(--lime);text-align:left}
.matbtn b{font:700 15px/1.1 var(--display)}.matbtn .prole{margin-top:3px}
.folders{display:flex;gap:6px;flex-wrap:wrap}
.folder{background:none;border:1px solid var(--line);padding:8px 10px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.folder[aria-pressed="true"]{border-color:var(--lime);color:var(--lime)}
.folder .n{font:10px/1 var(--tag);color:var(--muted)}
.mitem{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px;background:var(--panel-2);border:1px solid var(--line);text-align:left;width:100%}
.mitem .cover{width:56px;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--line);background:var(--ink)}
.mitem .cover.txt{display:flex;align-items:center;justify-content:center;font:20px/1 var(--tag);color:var(--muted)}
.mst{display:inline-block;font:10px/1 var(--tag);padding:3px 6px;border:1px solid var(--muted);color:var(--muted);margin-right:6px}
.mst.programado,.mst.postado{border-color:var(--lime);color:var(--lime)}
.mst.aguardando,.mst.ajuste{border-color:var(--warn);color:var(--warn)}
.mgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.mgal button{padding:0;border:1px solid var(--line);background:var(--panel-2);position:relative}
.mgal img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.mgal span{position:absolute;left:4px;top:4px;font:10px/1 var(--tag);background:rgba(0,0,0,.6);color:#fff;padding:2px 4px}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,8,20,.92);display:flex;align-items:center;justify-content:center;gap:12px;padding:16px}
.lightbox img{max-width:min(92vw,720px);max-height:86vh;object-fit:contain}
.lightbox button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;padding:10px 14px;font-size:18px}
.lightbox .lbx{position:absolute;top:12px;right:12px}
.lightbox .lbn{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font:12px/1 var(--tag);color:#fff}

.alter.hot{padding:12px;border:1px solid var(--warn)}
.ord.alt.feita{opacity:.92}
.ordens.hot{padding:12px;border:1px solid var(--warn)}
.ord{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;line-height:1.4}
.ord p{margin:0}.ord textarea{min-height:56px;background:var(--ink);border:1px solid var(--line);padding:8px;font-size:13.5px;resize:vertical}
.ord .primary{align-self:flex-start;padding:8px 12px}
.opill{font:10px/1 var(--tag);padding:3px 5px;border:1px solid var(--muted);color:var(--muted);flex:none}
.ord.feito .opill{background:var(--lime);color:var(--blue);border-color:var(--lime)}
.ord.pergunta .opill{background:var(--warn);color:#1b0d05;border-color:var(--warn)}
.ord.andamento .opill{border-color:var(--lime);color:var(--lime)}
.oq{font-weight:600}
.strip.mini2 img{width:52px}
.aprov,.radar{display:flex;flex-direction:column;gap:8px}
.aprov.hot{padding:12px;border:1px solid var(--lime);box-shadow:0 0 0 2px rgba(185,252,1,.2)}
.acard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px;background:var(--panel-2);border:1px solid var(--line);text-align:left;width:100%}
.strip{display:flex;gap:6px;overflow-x:auto;max-width:100%}
.strip img{flex:none;background:var(--panel-2);border:1px solid var(--line);aspect-ratio:4/5;object-fit:cover}
.strip.mini img{width:40px}.strip.mini{max-width:92px;overflow:hidden}
.strip.big img{width:min(240px,70%);scroll-snap-align:start}.strip.big{scroll-snap-type:x mandatory;padding-bottom:6px}
.ainfo{display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.45}.ainfo p{margin:0}
.legenda{white-space:pre-wrap;font-size:13.5px;line-height:1.5;margin:6px 0 0;background:var(--panel-2);border:1px solid var(--line);padding:10px}
.adjbox{display:flex;flex-direction:column;gap:8px}.adjbox textarea{min-height:80px;background:var(--panel-2);border:1px solid var(--line);padding:10px;font-size:14px;resize:vertical}
.adjbox .primary{align-self:flex-start}
.recent{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.ritem{display:flex;flex-direction:column;gap:3px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.rtop{display:flex;gap:8px;align-items:baseline}
.rnota{font:11px/1 var(--tag);background:var(--lime);color:var(--blue);padding:3px 5px;flex:none}
.rmeta{font-size:12px;color:var(--muted);margin:0}.rmeta a{color:var(--muted)}

@media (max-width:820px){
  body{overflow:auto}
  .shell{height:auto;min-height:100%}
  .app{flex-direction:column}
  .stage{flex:none}
  .panel{width:100%;border-left:0;border-top:1px solid var(--line);min-height:60vh}
  .vcol .stage{flex:none}
  .tabs{flex-basis:100%;order:5}
  .hint{margin-left:0;flex-basis:100%}
  .msgs{max-height:50vh}
}
@media (prefers-reduced-motion:reduce){.bubble{transition:none}.mic.rec{animation:none}}

.reelvid{width:100%;max-width:360px;aspect-ratio:9/16;background:#000;border:1px solid var(--line);display:block}
/* ===== Calendário ===== */
.cal{--c-frase:#b9fc01;--c-carrossel:#3d7bff;--c-estatico:#ff9a3d;--c-reels:#a35cff}
.calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.calbar h3{margin:0;font:700 20px/1.1 var(--display);min-width:170px;text-transform:capitalize}
.calbar .tbtn{font-size:13px;padding:7px 11px;color:var(--fg)}
.callegend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted)}
.callegend span{display:inline-flex;align-items:center;gap:6px}
.callegend i{width:12px;height:12px;display:inline-block;border-radius:3px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calwd{font:11px/1 var(--tag);color:var(--muted);text-align:center;padding:4px 0}

  R(-3, Y(-20), 6, 6, L.skin);

    if (L.glasses) { R(-1, Y(-18), 5, 1, "#0d0d0d"); R(0, Y(-18), 1, 1, "#7aa0ff"); R(2, Y(-18), 1, 1, "#7aa0ff"); }
    if (L.beard) R(-1, Y(-16), 4, 2, hair); else R(1, Y(-16), 1, 1, shade(L.skin, 0.7));

}

  const items = RADAR && Array.isArray(RADAR.itens) ? RADAR.itens.slice(0, 4).map(x => `${x.titulo} (${x.fonte || "sem fonte"}, ${x.data || ""})`).join(" | ") : "";
  const ev = EVENTS.slice(-8).map(e => e.text).join("; ");
  const pend = pendentes().map(x => x.tema).join(" | ");
  return `O QUE ESTÁ ROLANDO NA VILA AGORA
- Os outros: ${others || "ninguém por perto"}.
- Fofocas de hoje: ${ev || "nada demais ainda"}.
- Trends do radar da Pietra: ${items || "o radar ainda não rodou hoje"}.
- Esperando aprovação do {{SEU_NOME}}: ${pend || "nada"}.`;
}
function muralFor(a) {
  if (!MURAL) return townContext([a]);
  return `RECADO DO GERENTE (${whenText(MURAL.atualizadoEm)}): ${MURAL.resumo || ""}
Cobrança do Gerente para ${a.id === "gerente" ? "a equipe" : "você"}: ${a.id === "gerente" ? JSON.stringify(MURAL.equipe || {}) : (a.cobranca || "nenhuma")}
Pendências do {{SEU_NOME}}: ${(MURAL.paraWill || []).join(" | ") || "nenhuma"}
${townContext([a])}`;
}
function addMsg(box, who, text, cls) { const m = el("div", "m " + cls); if (who) m.append(el("span", "who", who)); const body = el("span"); renderRich(body, text); m.append(body); box.append(m); box.scrollTop = box.scrollHeight; return body; }
function renderRich(node, text) { node.replaceChildren(); String(text).split("**").forEach((p, i) => node.append(i % 2 ? el("strong", null, p) : document.createTextNode(p))); }
const ERR = {
  not_granted:"A conversa está desligada nesta página. Para conversar, permita o uso do Claude quando o aviso aparecer.",
  sampling_disabled:"O Claude não está disponível nesta conta.", rate_limited:"Muitas mensagens seguidas. Espera um pouco e manda de novo.",
  session_expired:"Sua sessão expirou. Entre de novo no claude.ai.", refused:"Não consegui responder isso. Tenta perguntar de outro jeito.",
  empty_completion:"Fiquei sem resposta. Tenta reformular.", invalid_json:"A equipe se embolou na resposta. Manda de novo.",
};
function voiceToggle() {
  const b = el("button", "ghost", "Ouvir respostas em voz"); b.type = "button"; b.setAttribute("aria-pressed", String(voiceReplies));
  b.addEventListener("click", () => { voiceReplies = !voiceReplies; b.setAttribute("aria-pressed", String(voiceReplies)); if (!voiceReplies && tts) tts.stop().catch(() => {}); });
  return b;
}

function openChat(a) {
  matView = null;
  if (!a || meeting) return;
  if (selected && selected !== a) release(selected);
  if (ctl) ctl.abort();
  rosterRefs = null;
  const before = a.act ? labelOf(a).toLowerCase() : "por aí";
  selected = a; a.inFurn = null; a.pose = "stand"; a.path = a.path.slice(0, 1); hush(a);
  if (a.act === "sleep" || a.act === "leitura") { a.path = []; say(a, pick(["Hã? Já é de manhã?","Desci de pijama, tá? Fala rápido.","Isso é hora, chefe?"]), 3500); }
  else if (a.inFurn === TOWER || (a.tgt && a.tgt.inFurn === TOWER)) say(a, pick(["Desci correndo, o que houve?","Pausei a série pra você, hein.","Oi, chefe! Fala."]), 3000);
  const ax = Math.round(a.path.length ? a.path[0][0] : a.gx), ay = Math.round(a.path.length ? a.path[0][1] : a.gy);
  const p = bfs(WILL.gx, WILL.gy, (x, y) => Math.abs(x - ax) + Math.abs(y - ay) === 1 && !edges.has(ek(x, y, ax, ay)));
  if (p) WILL.path = p;
  a.act = "conversa"; logEvent("o {{SEU_NOME}} chamou " + art(a) + " pra conversar");

  panel.replaceChildren();
  const chat = el("div", "chat");
  const head = el("div", "chead");
  const back = el("button", "back", "← VILA"); back.type = "button"; back.addEventListener("click", showRoster);
  const info = el("div"); info.style.minWidth = "0";
  const nm = el("div"); nm.append(el("span", "pname", a.name + " "), el("span", "prole", a.role));
  info.append(nm, el("div", "cstat", "Estava: " + before));
  head.append(back, portrait(a), info);
  const box = el("div", "msgs"), chips = el("div", "chips");
  const comp = el("form", "compose");
  const ta = el("textarea"); ta.id = "msg-" + a.id; ta.placeholder = dict ? "Fala ou escreve para " + a.name + "…" : "Escreve para " + a.name + "…"; ta.setAttribute("aria-label", "Mensagem para " + a.name);
  const mic = el("button", "mic"); mic.type = "button";
  const send = el("button", "send", "Enviar"); send.type = "submit";
  comp.append(ta, mic, send);
  const foot = el("div", "cfoot");
  const row = el("div", "row"); if (tts) row.append(voiceToggle());
  const copy = el("button", "ghost", "Copiar pedido para o Claude Code"); copy.type = "button"; row.append(copy);
  foot.append(row, el("div", null, "Aqui é o Claude no papel de " + a.name + ". Entregas de verdade (artes, vídeos, pesquisa e programação) rodam no Claude Code."));
  chat.append(head, box, chips, comp, foot); panel.append(chat);

  if (!a.turns.length) addMsg(box, null, a.name + " parou o que estava fazendo para falar com você.", "sys");
  for (const t of a.turns) addMsg(box, t.role === "user" ? "VOCÊ" : a.name.toUpperCase(), t.content, t.role === "user" ? "me" : "them");
  for (const c of a.chips) { const b = el("button", "chip", c); b.type = "button"; b.addEventListener("click", () => { ta.value = c; comp.requestSubmit(); }); chips.append(b); }
  copy.addEventListener("click", () => { const lastAsk = [...a.turns].reverse().find(t => t.role === "user"); copyText("usa o " + a.id + " para: " + (lastAsk ? lastAsk.content : ""), copy); });
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); comp.requestSubmit(); } });
  attachMic(mic, ta, () => comp.requestSubmit());
  if (capsReady && !sample) { ta.disabled = true; send.disabled = true; mic.hidden = true; addMsg(box, null, "A conversa só funciona com a página aberta no claude.ai. Aqui você ainda pode passear pela vila.", "sys"); }
  const idle = () => { send.disabled = false; send.textContent = "Enviar"; send.className = "send"; send.type = "submit"; send.onclick = null; };

  comp.addEventListener("submit", async e => {
    e.preventDefault();
    const text = ta.value.trim(); if (!text || a.busy) return;
    if (!sample) { addMsg(box, null, capsReady ? "A conversa não está disponível nesta visualização." : "Conectando… tenta de novo em alguns segundos.", "sys"); return; }
    if (tts) tts.stop().catch(() => {});
    ta.value = ""; a.turns.push({role:"user", content:text}); addMsg(box, "VOCÊ", text, "me");
    const out = addMsg(box, a.name.toUpperCase(), "pensando…", "them");
    a.busy = true; say(a, "…", 0);
    ctl = new AbortController(); const my = ctl;
    send.textContent = "Parar"; send.className = "stop"; send.type = "button"; send.onclick = () => my.abort();
    const turns = a.turns.slice(-12); while (turns.length && turns[0].role !== "user") turns.shift();
    try {
      const tools = await webTools(a, box);
      const opts = {cache:false, signal:my.signal};
      if (tools) opts.tools = tools;
      const obj = await sample.json([{role:"user", content:rules(a, before)}, ...turns], opts);
      const fala = String((obj && (obj.fala || obj.resposta)) || "Fechado.").slice(0, 1500);
      renderRich(out, fala); box.scrollTop = box.scrollHeight;
      a.turns.push({role:"assistant", content:fala});
      saveConv(a); lembrar(obj && obj.lembrar, a.name);
      say(a, fala.replace(/\*\*/g, "").split(/(?<=[.!?])\s/)[0].slice(0, 90), 6000, true);
      if (selected === a) speakAs(a, fala);
      const ord = obj && obj.ordem;
      if (ord && ord.pedido) { const ok = await createOrder(ord.para || a.id, ord.pedido, "chat com " + a.name); orderNote(box, ord.para || a.id, ok); }
    } catch (err) {
      const code = err && err.code;
      if (err && err.text) { renderRich(out, err.text); a.turns.push({role:"assistant", content:err.text}); } else { out.parentNode.remove(); a.turns.pop(); }
      hush(a);
      if (code !== "cancelled") addMsg(box, null, ERR[code] || "A conversa caiu no meio. Manda de novo.", "sys");
      if (code === "not_granted" || code === "sampling_disabled") ta.disabled = true;
    } finally { a.busy = false; if (ctl === my) ctl = null; if (selected === a) idle(); }
  });
  setTimeout(() => ta.focus({preventScroll:true}), 50);
}
function copyText(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = "Copiado. Cole no Claude Code"; setTimeout(() => btn.textContent = o, 2200); };
  const fb = () => { const t = el("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.append(t); t.select(); try { document.execCommand("copy"); done(); } catch {} t.remove(); };
  try { navigator.clipboard.writeText(text).then(done, fb); } catch { fb(); }
}

// ================= meeting =================
function startMeeting() {
  matView = null;
  if (selected) { release(selected); selected = null; }
  if (ctl) ctl.abort();
  meeting = {log:[]}; rosterRefs = null; logEvent("o {{SEU_NOME}} chamou a equipe toda pra uma reunião");
  for (const a of TEAM) { hush(a); a.act = null; }
  const p = bfs(WILL.gx, WILL.gy, (x, y) => x === WILL_SEAT.spot[0] && y === WILL_SEAT.spot[1]); if (p) WILL.path = p;
  const late = SP.h >= 21 || SP.h < 7;
  setTimeout(() => say(byId("gerente"), late ? "Reunião a essa hora? Tá bom, tô indo." : "Todo mundo pra sala, reunião!", 4000), 300);

  panel.replaceChildren();
  const chat = el("div", "chat");
  const head = el("div", "chead");
  const end = el("button", "back", "ENCERRAR"); end.type = "button";
  const info = el("div"); info.append(el("div", "pname", "Reunião no escritório"), el("div", "cstat", "A equipe toda está indo para a mesa. Fale com todo mundo ou chame alguém pelo nome."));
  head.append(end, info);
  const box = el("div", "msgs"), chips = el("div", "chips");
  const comp = el("form", "compose");
  const ta = el("textarea"); ta.id = "meeting-msg"; ta.placeholder = "Fala com a equipe…"; ta.setAttribute("aria-label", "Mensagem para a equipe");
  const mic = el("button", "mic"); mic.type = "button";
  const send = el("button", "send", "Enviar"); send.type = "submit";
  comp.append(ta, mic, send);
  const foot = el("div", "cfoot"); const row = el("div", "row"); if (tts) row.append(voiceToggle());
  foot.append(row, el("div", null, "Cada resposta vem de quem tem algo a dizer. Decisões tomadas aqui viram tarefa no Claude Code."));
  chat.append(head, box, chips, comp, foot); panel.append(chat);
  addMsg(box, null, "Reunião aberta às " + SP.text.split("· ")[1] + ".", "sys");
  for (const c of ["Como estamos para essa semana?", "Ideias de pauta para a Black Friday", "Alguém viu alguma série boa?"]) { const b = el("button", "chip", c); b.type = "button"; b.addEventListener("click", () => { ta.value = c; comp.requestSubmit(); }); chips.append(b); }
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); comp.requestSubmit(); } });
  attachMic(mic, ta, () => comp.requestSubmit());
  end.addEventListener("click", () => { if (ctl) ctl.abort(); if (tts) tts.stop().catch(() => {}); meeting = null; for (const a of TEAM) { a.act = null; hush(a); } WILL.pose = "stand"; showRoster(); });

  comp.addEventListener("submit", async e => {
    e.preventDefault();
    const text = ta.value.trim(); if (!text || send.disabled) return;
    if (!sample) { addMsg(box, null, capsReady ? "A reunião por chat só funciona no claude.ai." : "Conectando… tenta de novo em alguns segundos.", "sys"); return; }
    if (tts) tts.stop().catch(() => {});
    ta.value = ""; meeting.log.push(["will", text]); addMsg(box, "VOCÊ", text, "me");
    const wait = addMsg(box, null, "A equipe está pensando…", "sys");
    send.disabled = true; ctl = new AbortController(); const my = ctl;
    const transcript = meeting.log.slice(-16).map(([w, t]) => (w === "will" ? "{{SEU_NOME}}" : byId(w).name) + ": " + t).join("\n");
    const prompt = `Simule a próxima rodada de falas numa reunião da equipe da agência do {{SEU_NOME}}, no Escritório {{NOME_DA_AGENCIA}}. Agora é ${SP.text} (Brasília).

EQUIPE
${TEAM.map(a => `- ${a.name} (id "${a.id}"), ${a.role}. Trabalho: ${a.manual.split(". ").slice(0, 2).join(". ")}. Status: ${a.status} Vida: ${a.life}`).join("\n")}

CONTEXTO
${CONTEXT}

${AGENDA}

${MURAL ? "MURAL DO GERENTE\n" + muralFor(byId("gerente")) : ""}

MEMÓRIA DA EQUIPE (o que o {{SEU_NOME}} já disse e o que já foi feito; vale mais que o mural; nunca cobre o que está resolvido aqui)
${memoriaTxt(45)}

TRANSCRIÇÃO ATÉ AGORA
${transcript}

O JEITO DO WILL
${jeito()}

REGRAS
- Responda só à última fala do {{SEU_NOME}}. Fala apenas quem tem algo NOVO e útil: normalmente 1 ou 2 pessoas, no máximo 3. Quem não tem nada novo fica calado.
- Nunca repita, nem com outras palavras, o que já está na transcrição. Ninguém repete o que outro acabou de dizer.
- Se o {{SEU_NOME}} chamar alguém pelo nome, essa pessoa fala primeiro (e muitas vezes só ela).
- Se for uma ORDEM: só o responsável responde, em uma frase, confirmando ("Fechado, faço até as 16h."). Ninguém discute. Registre em "ordens" com um pedido completo e autossuficiente. Pergunta só se for impossível executar sem a resposta.
- Conversa natural de gente: frases curtas, podem reagir uma à outra, discordar, fazer piada rápida. O Gustavo cobra prazos.
- Cada fala com até 35 palavras, português do Brasil falado, sem markdown, sem emoji. Nunca invente número ou fonte de mercado.
- Se precisarem de algo atual, usem as ferramentas buscar_na_web e ler_pagina antes de responder e citem veículo e data.
Responda só um objeto JSON: {"falas": [{"quem": id, "fala": texto}], "ordens": [{"para": id, "pedido": texto}], "lembrar": [texto]}. "ordens" pode ser []. "lembrar": fatos NOVOS que o {{SEU_NOME}} disse na última fala para a equipe guardar (decisão, algo feito ou resolvido, mudança de data), frases curtas em terceira pessoa; [] se nada.`;
    try {
      const tools = await webTools(null, box);
      const opts = {cache:false, signal:my.signal}; if (tools) opts.tools = tools;
      const res = await sample.json(prompt, opts);
      wait.parentNode.remove();
      const arr = Array.isArray(res) ? res : (res && Array.isArray(res.falas) ? res.falas : []);
      const lines = arr.map(l => [byId(String(l && l.quem)), String(l && l.fala || "").slice(0, 400)]).filter(l => l[0] && l[1]);
      if (!lines.length) addMsg(box, null, "Ninguém tinha nada novo a dizer.", "sys");
      for (const [a, f] of lines) { meeting.log.push([a.id, f]); addMsg(box, a.name.toUpperCase(), f, "them"); }
      lembrar(res && res.lembrar, "reunião");
      for (const o of (res && Array.isArray(res.ordens) ? res.ordens : [])) if (o && o.pedido) { const ok = await createOrder(o.para, o.pedido, "reunião"); orderNote(box, o.para, ok); }
      if (lines.length) {
        if (tts && voiceReplies) {
          meeting._round = lines;
          tts.speak(lines.map(([a, f], i) => ({text:f, voice:a.voice, rate:a.rate, language:"pt-BR", id:String(i)}))).catch(() => {});
        } else { for (const [a, f] of lines) { if (!meeting) break; say(a, f, 0, true); await sleep(Math.max(2500, f.length * 60)); hush(a); } }
      }
    } catch (err) {
      wait.parentNode && wait.parentNode.remove();
      if (err && err.code !== "cancelled") addMsg(box, null, ERR[err.code] || "A reunião caiu no meio. Manda de novo.", "sys");
    } finally { send.disabled = false; if (ctl === my) ctl = null; }
  });
  setTimeout(() => ta.focus({preventScroll:true}), 50);
}

// ================= boot =================
paintGround(); fit(); buildTabs(); buildPeople(); showRoster();
for (const a of TEAM) { const act = planFor(a); a.act = act; a.tgt = targetFor(a, act); if (a.tgt.spot) { a.gx = a.tgt.spot[0]; a.gy = a.tgt.spot[1]; } else if (a.tgt.wander) { const s = pick(a.tgt.wander); a.gx = s[0]; a.gy = s[1]; } else { a.gx = a.desk.spot[0]; a.gy = a.desk.spot[1]; } }
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
(async () => {
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  [sample, tts, dict, mcp, db] = await Promise.all([use("sample"), use("tts"), use("dictation"), use("mcp"), use("db")]);
  capsReady = true;
  checkNet();
  if (db) { subscribeMural(); subscribeWork(); } else if (rosterRefs) { renderMural(); renderAprov(); renderRadar(); }
  if (tts) {
    tts.onLine(({id}) => {
      if (!meeting || id == null) return;
      const round = meeting._round || []; const l = round[Number(id)];
      if (l) { for (const a of TEAM) hush(a); say(l[0], l[1], 0, true); }
    });
    tts.onState(({state}) => { if (state === "idle" && meeting) for (const a of TEAM) hush(a); });
  }
  if (rosterRefs) showRoster();
})();
})();
</script>
